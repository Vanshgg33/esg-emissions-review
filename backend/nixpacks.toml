[phases.setup]
nixPkgs = ["nodejs_20", "python312"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "cd ../frontend && npm install"
]

[phases.build]
cmds = [
  "cd ../frontend && npm run build",
  "cp -r ../frontend/dist/* staticfiles/ 2>/dev/null || true"
]

[start]
cmd = "gunicorn breatheesg.wsgi --log-file - --bind 0.0.0.0:$PORT"
