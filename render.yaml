services:
  - type: web
    name: breatheesg-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn breatheesg.wsgi --log-file - --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: breatheesg-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://breatheesg.onrender.com"
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_data

  - type: web
    name: breatheesg
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://breatheesg-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: breatheesg-db
    databaseName: breatheesg
    user: breatheesg
